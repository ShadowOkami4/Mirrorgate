<rect x="140" y="108" width="80" height="20" rx="10" fill="#4a90e2" fill-opacity="0.2" stroke="#4a90e2" stroke-opacity="0.6"/>
<text x="180" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#8fb6e0">↑ Atlas</text>
<text x="140" y="160" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="24" font-weight="700" fill="#f4f7fb">Ogledal</text>
<rect x="140" y="170" width="380" height="1.5" fill="url(#r)"/>
<rect x="140" y="184" width="380" height="40" rx="8" fill="#141824" stroke="#8fb6e0" stroke-opacity="0.35"/>
<text x="154" y="209" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-style="italic" font-size="13" fill="#c9d2de">“In Ogledal, one is never alone…”</text>
<rect x="140" y="236" width="300" height="8" rx="4" fill="#2b323c"/><rect x="140" y="252" width="360" height="8" rx="4" fill="#2b323c"/><rect x="140" y="268" width="250" height="8" rx="4" fill="#2b323c"/>
<rect x="140" y="288" width="380" height="34" rx="8" fill="#2a1416" stroke="#d0706a" stroke-opacity="0.5"/>
<text x="154" y="310" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#e8a49e">▸ GM only: secrets, open questions</text>
<rect x="140" y="332" width="380" height="46" rx="8" fill="#2a2416" stroke="#d9c48f" stroke-opacity="0.6"/>
<rect x="440" y="326" width="74" height="16" rx="3" fill="#d9c48f"/><text x="477" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700" fill="#2a2416">PLAYER INFO</text>
<text x="154" y="361" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#efe2bd">What players know</text>
