<path d="M540 118 L600 118" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="118" r="3" fill="#b39af0"/><text x="614" y="116" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">up: link to the section hub</text><text x="614" y="133" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">the graph and breadcrumbs</text><path d="M540 160 L600 160" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="160" r="3" fill="#b39af0"/><text x="614" y="158" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">Title</text><text x="614" y="175" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">inline titles are off; every page has an H1</text><path d="M540 204 L600 204" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="204" r="3" fill="#b39af0"/><text x="614" y="202" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">Quote</text><text x="614" y="219" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">the Professor's in-world voice</text><path d="M540 256 L600 256" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="256" r="3" fill="#b39af0"/><text x="614" y="254" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">Body</text><text x="614" y="271" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">the full truth, for the GM</text><path d="M540 305 L600 305" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="305" r="3" fill="#b39af0"/><text x="614" y="303" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">GM callout</text><text x="614" y="320" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">folded secrets and open questions</text><path d="M540 355 L600 355" stroke="#9aa6b4" stroke-opacity="0.4" stroke-dasharray="2 3"/><circle cx="600" cy="355" r="3" fill="#b39af0"/><text x="614" y="353" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="15" font-weight="700" fill="#eef2f7">Player box</text><text x="614" y="370" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa3ae">set player: true when it is written</text></svg>