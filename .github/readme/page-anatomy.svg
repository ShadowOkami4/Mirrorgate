<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Anatomy of a page">
<rect width="1000" height="420" rx="16" fill="#080a10"/>
<text x="500" y="44" text-anchor="middle" font-family="Iowan Old Style, Palatino Linotype, Book Antiqua, Palatino, Georgia, serif" font-size="24" font-weight="700" fill="#eef2f7">Anatomy of a page</text>
<text x="500" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#9aa3ae">Every page is written for the GM. What players may know sits in one box at the bottom.</text>
